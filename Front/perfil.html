<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Perfil - A Gusto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/estilo.css">
</head>
<body>
    <header>
        <div id="navbar"></div>
    </header>
    <main class="container py-5">
        <h2 class="mb-4">Mi Perfil</h2>
        <div id="perfil-info" class="card p-4 shadow-sm">
            <!-- Aquí se mostrarán los datos del usuario -->
        </div>
        <button id="logout-btn" class="btn btn-danger mt-4">Cerrar sesión</button>
    </main>

    <!-- Modal Detalle de Orden -->
    <div class="modal fade" id="detalleOrdenModal" tabindex="-1" aria-labelledby="detalleOrdenLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="detalleOrdenLabel">Detalle de la Orden</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="detalle-orden-body">
            <!-- Aquí se mostrarán los detalles -->
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="JS/buscador.js"></script>
    <script type="module" src="JS/authModal.js"></script>
    <script type="module" src="JS/login.js"></script>
    <script type="module" src="JS/carrito.js"></script>
    <script>
        // Cargar navbar
        fetch('navbar.html')
            .then(res => res.text())
            .then(html => { 
                document.getElementById('navbar').innerHTML = html;
                // Carga los scripts necesarios después de insertar el navbar
                ['JS/login.js', 'JS/authModal.js'].forEach(src => {
                    const script = document.createElement('script');
                    script.type = 'module';
                    script.src = src;
                    document.body.appendChild(script);
                });
            });
    </script>
    <script type="module" src="JS/perfilPanel.js"></script>
</body>
</html>

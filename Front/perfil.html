<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Perfil - A Gusto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/estilo.css">
</head>
<body>
    <header>
        <div id="navbar"></div>
    </header>
    <main class="container py-5">
        <h2 class="mb-4">Mi Perfil</h2>
        <div id="perfil-info" class="card p-4 shadow-sm">
            <!-- Aquí se mostrarán los datos del usuario -->
        </div>
        <button id="logout-btn" class="btn btn-danger mt-4">Cerrar sesión</button>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // Cargar navbar
        fetch('navbar.html')
            .then(res => res.text())
            .then(html => { document.getElementById('navbar').innerHTML = html; });
    </script>
    <script type="module" src="JS/perfilPanel.js"></script>
</body>
</html>

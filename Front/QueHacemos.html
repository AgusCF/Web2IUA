<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A Gusto - ¿Qué hacemos?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/estilo.css">
</head>

<body>
    <!-- Encabezado -->
    <header>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="Logo.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                    A Gusto
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">¿Qué somos?</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown">
                                ¿Qué hacemos?
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#alfajores">Alfajores</a></li>
                                <li><a class="dropdown-item" href="#tortas">Tortas</a></li>
                                <li><a class="dropdown-item" href="#huevos">Huevos</a></li>
                                <li><a class="dropdown-item" href="QueHacemos.html#cupcakes">Cupcakes</a></li>
                                <li><a class="dropdown-item" href="QueHacemos.html#bombones">Bombones</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#especiales">Especiales</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#carrito">Carrito</a>
                        </li>
                    </ul>
                    <!-- Agregamos id="buscador" al input para que el buscador lo pueda identificar -->
                    <form class="d-flex" role="search">
                        <input id="buscador" class="form-control me-2" type="search" placeholder="Buscar"
                            aria-label="Buscar">
                        <button class="btn btn-outline-success" type="submit">Buscar</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal -->
    <main id="productos-todos" class="pt-5">
        <!-- Los productos se cargarán dinámicamente aquí -->
    </main>

    <!-- Contenedor de Modales -->
    <div id="modales-container"></div>
    <!-- Modal de Login / Registro -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="login-form">
                    <div class="modal-header">
                        <h5 class="modal-title" id="loginModalLabel">Iniciar Sesión / Registro</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Campo para nombre de usuario -->
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" id="usuario" required>
                        </div>
                        <!-- Campo para teléfono -->
                        <div class="mb-3">
                            <label for="telefono" class="form-label">
                                Teléfono (Solo Argentina, se usará para WhatsApp)
                            </label>
                            <input type="tel" class="form-control" id="telefono" required>
                        </div>
                        <!-- Campo para confirmar teléfono -->
                        <div class="mb-3">
                            <label for="telefonoConfirm" class="form-label">Confirmar Teléfono</label>
                            <input type="tel" class="form-control" id="telefonoConfirm" required>
                        </div>
                        <!-- Div para mostrar posibles errores -->
                        <div id="login-error" class="text-danger"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Los scripts se cargarán con defer para ejecutar después de cargar el DOM -->
    <script defer src="JS/RenderProd.js"></script>
    <script defer src="JS/buscador.js"></script>
    <script defer src="JS/login.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    

</body>

</html>

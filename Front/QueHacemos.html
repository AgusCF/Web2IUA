<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A Gusto - ¿Qué hacemos?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/estilo.css">
</head>

<body>
    <!-- Encabezado -->
    <header>
        <!-- Navbar -->
        <div id="navbar"></div>
    </header>

    <!-- Contenido Principal -->
    <main id="productos-todos" class="pt-5">
        <!-- Los productos se cargarán dinámicamente aquí -->
    </main>

    <!-- Contenedor de Modales -->
    <div id="modales-container"></div>
    
    <!-- Modal de Login -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog">
        <div class="modal-content">
            <form id="login-form">
            <div class="modal-header">
                <h5 class="modal-title" id="loginModalLabel">Iniciar sesión</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="tel" class="form-control" id="telefono" placeholder="Número de teléfono" required>
                <input type="password" class="form-control mb-3" id="password" placeholder="Contraseña" required>
                <div id="login-error" class="text-danger"></div>
            </div>
            <div class="modal-footer d-flex flex-column">
                <button type="submit" class="btn btn-dark mb-2">Ingresar</button>
                <a href="#" id="show-register" class="text-primary">¿No tienes cuenta? Registrate</a>
            </div>
            </form>
        </div>
        </div>
    </div>

    <!-- Modal de Registro -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog">
        <div class="modal-content">
            <form id="register-form" style="display:none;">
            <div class="modal-header">
                <h5 class="modal-title">Registrarse</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="tel" class="form-control mb-3" id="reg-telefono" placeholder="Número de teléfono" required>
                <div id="register-error" class="text-danger"></div>
            </div>
            <div class="modal-footer d-flex flex-column">
                <button type="submit" class="btn btn-success mb-2">Registrarse</button>
                <a href="#" id="show-login" class="text-primary">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
            </form>
        </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <!-- Los scripts se cargarán con defer para ejecutar después de cargar el DOM -->
    <!-- <script defer src="JS/RenderProd.js"></script> -->
    <script defer src="JS/listarProductos.js"></script>
    <script defer src="JS/buscador.js"></script>
    <script defer src="JS/login.js"></script>
    <script defer src="JS/authModal.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        fetch('navbar.html')
            .then(res => res.text())
            .then(html => { document.getElementById('navbar').innerHTML = html; });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Espera a que el navbar se cargue dinámicamente
            const esperarNavbar = setInterval(() => {
                const loginLink = document.getElementById("login-link");
                const loginModal = document.getElementById("loginModal");
                if (loginLink && loginModal) {
                    clearInterval(esperarNavbar);
                    loginLink.addEventListener("click", function (e) {
                        e.preventDefault();
                        const modal = new bootstrap.Modal(loginModal);
                        modal.show();
                    });
                }
            }, 100);
        });
    </script>
    <script>
        // Cambia el botón de login según el usuario logueado
        document.addEventListener("DOMContentLoaded", function () {
            const esperarNavbar = setInterval(() => {
                const loginLink = document.getElementById("login-link");
                const usuario = JSON.parse(localStorage.getItem("usuarioActual"));
                if (loginLink) {
                    clearInterval(esperarNavbar);
                    if (usuario) {
                        if (usuario.role === "admin") {
                            loginLink.textContent = "Admin";
                            loginLink.href = "admin.html";
                        } else {
                            loginLink.textContent = "Perfil";
                            loginLink.href = "perfil.html";
                        }
                        loginLink.classList.remove("text-muted");
                    } else {
                        loginLink.textContent = "Login";
                        loginLink.href = "#";
                        loginLink.classList.add("text-muted");
                    }
                }
            }, 100);
        });
    </script>
</body>

</html>

<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A Gusto - ¿Qué hacemos?</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/estilo.css">
</head>

<body>
    <!-- Encabezado -->
    <header>
        <!-- Navbar -->
        <div id="navbar"></div>
    </header>

    <!-- Contenido Principal -->
    <main id="productos-todos" class="pt-5">
        <!-- Los productos se cargarán dinámicamente aquí -->
    </main>
    <!-- Scripts -->
    <!-- <script type="module" src="JS/RenderProd.js"></script> -->
    <script type="module">
        fetch('navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                // Ahora carga los scripts que dependen del DOM completo
                import('./JS/listarProductos.js');
                import('./JS/buscador.js');
                import('./JS/login.js');
                import('./JS/authModal.js');
            });
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Espera a que el navbar se cargue dinámicamente
            const esperarNavbar = setInterval(() => {
                const loginLink = document.getElementById("login-link");
                const loginModal = document.getElementById("loginModal");
                if (loginLink && loginModal) {
                    clearInterval(esperarNavbar);
                    loginLink.addEventListener("click", function (e) {
                        e.preventDefault();
                        const modal = new bootstrap.Modal(loginModal);
                        modal.show();
                    });
                }
            }, 100);
        });
    </script>
    <script>
        // Cambia el botón de login según el usuario logueado
        document.addEventListener("DOMContentLoaded", function () {
            const esperarNavbar = setInterval(() => {
                const loginLink = document.getElementById("login-link");
                const usuario = JSON.parse(localStorage.getItem("usuarioActual"));
                if (loginLink) {
                    clearInterval(esperarNavbar);
                    if (usuario) {
                        if (usuario.role === "admin") {
                            loginLink.textContent = "Admin";
                            loginLink.href = "admin.html";
                        } else {
                            loginLink.textContent = "Perfil";
                            loginLink.href = "perfil.html";
                        }
                        loginLink.classList.remove("text-muted");
                    } else {
                        loginLink.textContent = "Login";
                        loginLink.href = "#";
                        loginLink.classList.add("text-muted");
                    }
                }
            }, 100);
        });
    </script>
</body>

</html>

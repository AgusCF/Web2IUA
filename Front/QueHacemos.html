<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A Gusto - ¿Qué hacemos?</title>
    <link rel="shortcut icon" href="https://web2iua-back.onrender.com/uploads/opt_Logo.webp" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/estilo.css">
</head>

<body>
    <!-- Encabezado -->
    <header>
        <!-- Navbar -->
        <div id="navbar"></div>
    </header>

    <!-- Contenedor de Modales -->
    <div id="modales-container"></div>
    <!-- Modals globales -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <!-- ...contenido del modal login... -->
    </div>
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <!-- ...contenido del modal registro... -->
    </div>
    <div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
        <!-- ...contenido del modal carrito... -->
    </div>

    <!-- Contenido Principal -->
    <main id="productos-todos" class="pt-5">
        <!-- Los productos se cargarán dinámicamente aquí -->
    </main>

    <!-- Scripts -->
    <script>
        fetch('navbar.html')
            .then(res => res.text())
            .then(html => { document.getElementById('navbar').innerHTML = html; });
    </script>
    <!-- Los scripts se cargarán con defer para ejecutar después de cargar el DOM -->

    <script>
        // Cambia el botón de login según el usuario logueado
        document.addEventListener("DOMContentLoaded", function () {
            const esperarNavbar = setInterval(() => {
                const loginLink = document.getElementById("login-link");
                const usuario = JSON.parse(localStorage.getItem("usuarioActual"));
                if (loginLink) {
                    clearInterval(esperarNavbar);
                    if (usuario) {
                        if (usuario.role === "admin") {
                            loginLink.textContent = "Admin";
                            loginLink.href = "admin.html";
                        } else {
                            loginLink.textContent = "Perfil";
                            loginLink.href = "perfil.html";
                        }
                        loginLink.classList.remove("text-muted");
                        // Redirigir al hacer click
                        loginLink.onclick = function(e) {
                            e.preventDefault();
                            window.location.href = this.href;
                        };
                    } else {
                        loginLink.textContent = "Login";
                        loginLink.href = "#";
                        loginLink.classList.add("text-muted");
                        // Mostrar modal de login
                        loginLink.onclick = function(e) {
                            e.preventDefault();
                            const loginModal = document.getElementById("loginModal");
                            if (loginModal && window.bootstrap) {
                                const modal = new bootstrap.Modal(loginModal);
                                modal.show();
                            }
                        };
                    }
                }
            }, 100);
        });
        // Lazy loading avanzado para imágenes con data-src
        document.addEventListener("DOMContentLoaded", function() {
            const images = document.querySelectorAll('img.lazyload');
            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src;
                    img.classList.remove('lazyload');
                    obs.unobserve(img);
                    }
                });
                });
                images.forEach(img => observer.observe(img));
            } else {
                // Fallback para navegadores antiguos
                images.forEach(img => { img.src = img.dataset.src; });
            }
        });
    </script>
    <!-- <script defer src="JS/RenderProd.js"></script> -->
    <script type="module" src="JS/listarProductos.js"></script>
    <script type="module" src="JS/buscador.js"></script>
    <script type="module" src="JS/login.js"></script>
    <script type="module" src="JS/authModal.js"></script>
    <script type="module" src="JS/carrito.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Espera a que el navbar se cargue dinámicamente
            const esperarNavbar = setInterval(() => {
                const loginLink = document.getElementById("login-link");
                const loginModal = document.getElementById("loginModal");
                if (loginLink && loginModal) {
                    clearInterval(esperarNavbar);
                    loginLink.addEventListener("click", function (e) {
                        e.preventDefault();
                        const modal = new bootstrap.Modal(loginModal);
                        modal.show();
                    });
                }
            }, 100);
        });
    </script>
</body>

</html>

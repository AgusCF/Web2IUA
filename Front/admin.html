<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de Administración - A Gusto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/estilo.css">
</head>
<body>
    <header>
        <div id="navbar"></div>
    </header>
    <main class="container py-5">
        <h2 class="mb-4">Panel de Administración</h2>
        <div class="alert alert-info">Aquí podrás gestionar productos, usuarios y pedidos.</div>
        <!-- Aquí irán los CRUDs de productos, usuarios, etc. -->
        <button id="logout-btn" class="btn btn-danger mt-4">Cerrar sesión</button>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Cargar navbar
        fetch('navbar.html')
            .then(res => res.text())
            .then(html => { document.getElementById('navbar').innerHTML = html; });
    </script>
    <script>
        // Verifica si el usuario es admin
        document.addEventListener("DOMContentLoaded", function () {
            const usuario = JSON.parse(localStorage.getItem("usuarioActual"));
            if (!usuario || usuario.role !== "admin") {
                alert("Acceso denegado. Solo los administradores pueden acceder a esta página.");
                // Redirige al inicio si no es admin
                window.location.href = "/";
            }
            document.getElementById("logout-btn").onclick = function () {
                localStorage.removeItem("usuarioActual");
                window.location.href = "/";
            };
        });
    </script>
</body>
</html>
